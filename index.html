<body><div class="layout"><header class="top"><div class="brand"><div class="logo">↗</div><div><small>Vinschool · Grade 5 ICT</small><strong>Link It. Credit It. Share It Right.</strong></div></div><div class="headmeta"><strong>Unit 3 · Week 13</strong>Intellectual Property · 35 min</div></header><div class="main"><aside id="sidebar" class="sidebar"></aside><div class="pane"><div id="progress" class="progresswrap hide"></div><main id="app" class="card" aria-live="polite"></main><div class="foot">🔐 Your answers stay in this browser until you download your Excel file. Refreshing or closing this page may erase your work.</div></div></div></div><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const CONFIG={grade:'5',subject:'ICT',unit:'Unit 3',week:13,topic:'Intellectual Property',duration:35,classes:['5B1','5B2','5B3']};
const quiz=[
 ['What does copyright protect?',['Original creative works','Wi-Fi signals','Keyboard shortcuts','Computer batteries'],0,'Copyright protects original creative work.'],
 ['What should you check before reusing a photo?',['Number of likes','Licence and original source','Image size only','Search ranking'],1,'Check the item’s licence and source page.'],
 ['What is a hyperlink?',['A clickable connection to another location','A type of password','A printed photo','A computer cable'],0,'A hyperlink opens another location, such as a webpage.'],
 ['Which shortcut opens Insert Link in Microsoft Word?',['Ctrl + S','Ctrl + P','Ctrl + K','Ctrl + V'],2,'Ctrl + K opens the Insert Link command in Word.'],
 ['Which is a useful source credit?',['Found on Google','My favourite photo','Picture copied yesterday','Creator, title, original URL and licence'],3,'A clear source credit identifies the creator, work, source and licence.'],
 ['What can happen to a picture you post online?',['It becomes impossible to save','It can be copied and reposted','It always disappears after one day','Copyright stops applying'],1,'Online content can be saved, forwarded and reposted.'],
 ['Which statement about credit and permission is true?',['Crediting always replaces permission','Everything online is public domain','Credit and permission are different','Only videos need permission'],2,'Credit tells readers the source; permission determines allowed reuse.'],
 ['What does a Creative Commons licence tell you?',['Conditions for reusing a work','How to turn on a computer','How fast a website loads','The creator’s home address'],0,'A Creative Commons licence states reuse conditions.'],
 ['What is an example of digital disruption?',['A pencil case','A textbook cover','A paper bookmark','Online publishing changing how news spreads'],3,'Digital tools change how information is produced and shared.'],
 ['Where can you find help inserting a hyperlink?',['An unrelated advertisement','Word Help or a teacher','Any unverified pop-up','A music playlist'],1,'Teachers and official Microsoft Word Help are reliable sources.']
];
const taskDefs=[
 {id:'goals',name:'Learning Goals',icon:'🎯',time:1},
 {id:'warmup',name:'Driving Question',icon:'💭',time:2},
 {id:'owners',name:'Who Owns It?',icon:'©',time:3},
 {id:'licences',name:'Check the Licence',icon:'📜',time:3},
 {id:'sharing',name:'Digital Sharing',icon:'🌐',time:2},
 {id:'credits',name:'Credit vs Permission',icon:'📝',time:3},
 {id:'link',name:'Hyperlink Workshop',icon:'🔗',time:4},
 {id:'sources',name:'Trusted Sources',icon:'📚',time:6},
 {id:'help',name:'Find Helpful Support',icon:'🧑‍🏫',time:2},
 {id:'quiz',name:'Review Quiz',icon:'🎮',time:7},
 {id:'reflect',name:'Exit Ticket',icon:'✨',time:2},
 {id:'results',name:'Results & Download',icon:'🏆',time:0}
];
let state={name:'',cls:'',started:false,at:0,done:{},answers:{},quizAnswers:Array(10).fill(null),quizSubmitted:false,quizAt:0,checked:{},challenge:'',downloaded:false};
const $=s=>document.querySelector(s);const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=(id,options)=>`<div class="choices">${options.map((o,i)=>`<button type="button" class="choice ${state.answers[id]===String(i)?'selected':''}" data-pick="${id}" data-value="${i}" aria-pressed="${state.answers[id]===String(i)}"><b>${String.fromCharCode(65+i)}</b><span>${h(o)}</span></button>`).join('')}</div>`;
const inp=(id,label,placeholder='',multi=false)=>`<div class="field"><label for="a_${id}">${label}</label>${multi?`<textarea id="a_${id}" data-field="${id}" placeholder="${h(placeholder)}">${h(state.answers[id]||'')}</textarea>`:`<input id="a_${id}" data-field="${id}" placeholder="${h(placeholder)}" value="${h(state.answers[id]||'')}">`}</div>`;
const eyebrow=(s)=>`<div class="eyebrow">${s}</div>`;const f=(s)=>`<div class="info">💡 ${s}</div>`;
function toast(msg){$('#toast').innerHTML=`<div class="toast">${h(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').innerHTML='',3100)}
function isComplete(id){if(id==='goals')return true;if(id==='warmup')return (state.answers.warmup||'').trim().length>=12;if(id==='owners')return state.answers.owner!==undefined;if(id==='licences')return state.answers.licence!==undefined;if(id==='sharing')return state.answers.sharing!==undefined;if(id==='credits')return state.answers.credit!==undefined;if(id==='link')return state.answers.linkText==='Smithsonian Learning Lab' && /^https:\/\/learninglab\.si\.edu\/?$/i.test((state.answers.linkUrl||'').trim());if(id==='sources')return [1,2].every(n=>['title','creator','url','licence'].every(k=>(state.answers[`s${n}${k}`]||'').trim().length>1)&&validUrl(state.answers[`s${n}url`]));if(id==='help')return state.answers.help!==undefined;if(id==='quiz')return state.quizSubmitted;if(id==='reflect')return (state.answers.reflect||'').trim().length>=12;return true;}
function validUrl(v){try{let u=new URL(v);return ['http:','https:'].includes(u.protocol)&&u.hostname.includes('.')}catch{return false}}
const required=taskDefs.filter(t=>t.id!=='results');
function stepDone(id){return !!state.done[id]}
function progressUI(){const count=required.filter(x=>stepDone(x.id)).length;$('#progress').classList.remove('hide');$('#progress').innerHTML=`<div><strong>Task ${state.at+1} of ${taskDefs.length}</strong><br><span>${count} of ${required.length} required tasks finished</span></div><div class="track" role="progressbar" aria-label="Lesson completion" aria-valuenow="${count}" aria-valuemin="0" aria-valuemax="${required.length}"><div class="fill" style="width:${Math.round(count/required.length*100)}%"></div></div><strong>${Math.round(count/required.length*100)}%</strong>`;}
function sidebar(){if(!state.started){$('#sidebar').classList.add('hide');$('#progress').classList.add('hide');return}$('#sidebar').classList.remove('hide');$('#sidebar').innerHTML=`<div class="side-head">Your learning journey</div>${taskDefs.map((t,i)=>`<button class="step-item ${state.at===i?'active':''} ${stepDone(t.id)?'done':''}" data-goto="${i}" ${i>state.at&&!state.done[taskDefs[i-1].id]?'disabled':''}><span class="num">${stepDone(t.id)?'✓':i+1}</span><span>${t.icon} ${t.name}</span></button>`).join('')}<div class="side-foot"><strong>${h(state.name)}</strong> · ${h(state.cls)}<br>One task at a time. Your answers stay on this page until you download your Excel results.<br><br><button class="btn secondary" id="editProfile" style="width:100%;padding:9px">✎ Edit registration</button></div>`;}
function actions({prev=true,next='Complete Task',can=true,extra='' }={}){return `<div id="error" class="error" role="alert"></div><div class="actions">${prev?`<button class="btn secondary" id="previous">← Previous</button>`:'<span></span>'}<div class="flex">${extra}<button class="btn" id="next" ${can?'':'disabled'}>${next} →</button></div></div>`}
function screen(){const id=taskDefs[state.at].id;switch(id){
case 'goals':return `${eyebrow('01 · Learning goals · 1 min')}<div class="hero"><div><h1>Link It.<br>Credit It.<br>Share It Right.</h1><p class="lead">You can find amazing things online. But can you use them? Today you will practise checking content rights, giving credit and making links that work.</p><span class="pill">Unit 3 · Intellectual Property</span></div><div class="hero-visual"><svg viewBox="0 0 300 230" role="img" aria-label="Illustration of a digital document linked to a source"><rect x="31" y="18" width="176" height="194" rx="17" fill="#fff" stroke="#c6d5ed" stroke-width="3"/><rect x="52" y="40" width="110" height="17" rx="5" fill="#6f5cc4"/><rect x="52" y="74" width="130" height="8" rx="4" fill="#dae3f2"/><rect x="52" y="91" width="110" height="8" rx="4" fill="#dae3f2"/><rect x="52" y="115" width="138" height="65" rx="10" fill="#ccefeb"/><path d="M65 162 L91 138 L117 156 L145 130 L174 160" stroke="#23a38f" stroke-width="6" fill="none"/><circle cx="216" cy="92" r="47" fill="#f1d98c"/><path d="M199 91a22 22 0 0 1 22-22h9 M235 94a22 22 0 0 1-22 22h-9" stroke="#4c519c" stroke-width="8" stroke-linecap="round" fill="none"/><rect x="181" y="159" width="96" height="48" rx="13" fill="#253f65"/><text x="229" y="190" text-anchor="middle" fill="white" font-size="28">© ✓</text></svg></div></div><div class="cols" style="margin-top:17px"><div class="tile tint"><strong>🎯 I can...</strong><p>Insert hyperlinks and give creators clear source credits.</p></div><div class="tile tint"><strong>🛡️ I can...</strong><p>Check copyright rules and find online or offline help.</p></div></div><div class="info good">This lesson has 10 guided activities plus a reflection and a final Excel download. Budget: about 35 minutes.</div>${actions({prev:false,next:'Start Learning'})}`;
case 'warmup':return `${eyebrow('02 · Warm-up · 2 min')}<h2>Can I use any picture I find online?</h2><p>Imagine you are making a poster for the school website. You find a cute puppy photograph using a search engine.</p><div class="tile tint"><div class="emoji">🐶 🔍 📷</div><strong>Found online ≠ free to copy</strong><p>What should you check before using this picture?</p></div>${inp('warmup','✍️ Write your answer (one or two sentences).','I should check...',true)}<div class="info">Sentence starter: “Before I use an online picture, I should…”</div>${actions()}`;
case 'owners':return `${eyebrow('03 · Learn · 3 min')}<h2>Who owns online content?</h2><p>People create original pictures, music, videos and writing. Copyright may protect their work even when it is posted on the internet.</p><div class="cols"><div class="tile tint"><div class="emoji">📸</div><strong>Creator</strong><p>Makes an original photograph and may decide how it can be reused.</p></div><div class="tile tint"><div class="emoji">💻</div><strong>User</strong><p>Finds a picture and checks the rules before reusing it.</p></div></div><div class="rule" style="margin-top:14px">Remember: something being online does not mean you own it.</div><h3 style="margin-top:22px">Quick check: What is the best action?</h3>${pick('owner',['Download any picture without checking.','Find the original image page and check reuse rights.','Remove the creator’s name to avoid copyright.'])}<div id="answerNote"></div>${actions()}`;

const entries=[['[Content_Types].xml',ct],['_rels/.rels',wr],['xl/workbook.xml',wb],['xl/_rels/workbook.xml.rels',rel],['xl/styles.xml',styles],...sheets.map((s,i)=>[`xl/worksheets/sheet${i+1}.xml`,sheetXml(s[1],s[2])])];return new Blob([zip(entries)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
function download(){if(!required.every(t=>stepDone(t.id))){toast('Complete all required tasks first.');return}const blob=createWorkbook();const fname=`G5_${cleanFilename(state.cls)}_${cleanFilename(state.name)}_Week13_Results.xlsx`;const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=fname;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),6000);state.downloaded=true;toast('Excel downloaded. Upload it to your Canvas assignment.');}
function editReg(){snapshotInputs();state.started=false;render();toast('Correct your name or class, then select Start Lesson. Your completed work is retained.');}
document.addEventListener('input',e=>{if(e.target.matches('[data-field]')){state.answers[e.target.dataset.field]=e.target.value;if(state.at===6){const b=$('#next');if(b)b.disabled=!isComplete('link')} } });
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const id=t.id;const ds=t.dataset;if(ds.pick!==undefined){choose(ds.pick,ds.value);return}if(ds.goto!==undefined){const i=Number(ds.goto);if(i<=state.at||taskDefs.slice(0,i).every(x=>stepDone(x.id))){snapshotInputs();state.at=i;render()}return}if(ds.q!==undefined){state.quizAt=Number(ds.q);render();return}if(ds.qpick!==undefined){state.quizAnswers[state.quizAt]=Number(ds.qpick);render();return}if(id==='start'){const name=$('#studentName').value.trim().replace(/\s+/g,' '),cls=$('#studentClass').value;if(name.length<2||!CONFIG.classes.includes(cls)){$('#error').textContent='Please enter your name and choose your class before starting.';return}state.name=name;state.cls=cls;state.started=true;render();return}if(id==='editProfile'){editReg();return}if(id==='previous'){previousTask();return}if(id==='next'){nextTask();return}if(id==='fillDemo'){state.answers.linkText='Smithsonian Learning Lab';state.answers.linkUrl='https://learninglab.si.edu/';render();return}if(id==='testLink'){snapshotInputs();$('#linkFeedback').innerHTML=isComplete('link')?`<div class="feedback">✅ Your example link is correct! <a class="link" href="https://learninglab.si.edu/" target="_blank" rel="noopener noreferrer">Open the site ↗</a> (optional)</div>`:`<div class="info warn">Check both values. Text: <b>Smithsonian Learning Lab</b>. URL: <b>https://learninglab.si.edu/</b></div>`;$('#next').disabled=!isComplete('link');return}if(id==='qprevious'){if(state.quizAt>0){state.quizAt--;render()}else{previousTask()}return}if(id==='qnext'){if(state.quizAnswers[state.quizAt]!==null){state.quizAt++;render()}return}if(id==='submitQuiz'){if(state.quizAnswers.some(x=>x===null)){const er=$('#error');if(er)er.textContent='Please answer all 10 questions.';return}state.quizSubmitted=true;state.done.quiz=true;render();return}if(id==='retryQuiz'){state.quizSubmitted=false;state.quizAnswers=Array(10).fill(null);state.quizAt=0;state.done.quiz=false;render();return}if(id==='download'){download();return}});
render();
